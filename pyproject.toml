[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxora"
version = "0.1.0"
description = "Fluxora: Transform. Rebuild. Verify. Power Platform migration with rule-by-rule proof."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "anthropic==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fluxora = "orchestrator.cli:app"

[tool.setuptools]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
